name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Refresh citation counts
        continue-on-error: true
        run: npm run citations:refresh
      - name: Build with Eleventy
        run: npm run build
      - name: Verify citation data and badges
        run: |
          set -euo pipefail
          if [ ! -s src/data/citations.json ]; then
            echo "::error::src/data/citations.json is missing or empty - citation badges cannot render"
            echo "::error::is the file committed? it is not generated by the build"
            exit 1
          fi
          if [ ! -f _site/publications/index.html ]; then
            echo "::error::_site/publications/index.html was not produced by the build"
            exit 1
          fi
          expected=$(node -e 'const c=require("./src/data/citations.json");console.log(Object.values(c).filter(v=>typeof v.count==="number"&&v.count>0).length)')
          found=$(grep -o 'tag-cite' _site/publications/index.html | wc -l | tr -d ' ')
          echo "citation entries with count>0: $expected"
          echo "badges rendered on publications page: $found"
          if [ "$expected" -gt 0 ] && [ "$found" -eq 0 ]; then
            echo "::error::$expected non-zero citation counts but 0 badges rendered - template or data wiring is broken"
            exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Commit citation cache
        continue-on-error: true
        run: |
          git add -A -- src/data/citations.json || true
          if git diff --cached --quiet; then
            echo "No citation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(citations): refresh publication counts [skip ci]"
          git push origin HEAD:refs/heads/main

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
